plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Secrets such as the Gemini API key live in local.properties (gitignored),
// never in source code.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.example.voicerecorder'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.voicerecorder"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties.getProperty('GEMINI_API_KEY', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    /*
     * 8.1.8 ships 16 KB page aligned native libraries (7.1.6 did not).
     *
     * The "audio" package, not "full": DayTrace runs exactly one FFmpeg
     * command, which decodes an audio file and encodes MP3 with
     * libmp3lame (Mp3Converter). Every decoder it needs is built into
     * libavcodec, and libmp3lame is the only external encoder, so the
     * video codecs in "full" were never reachable. Same version and the
     * same 16 KB alignment; about 10 MB smaller per ABI.
     */
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.8'
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    // Background job for the Gemini summary (2.8.x supports compileSdk 33)
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // UI: fragments per screen, coroutines tied to the view lifecycle
    implementation 'androidx.fragment:fragment-ktx:1.5.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // Google integrations: AuthorizationClient (OAuth scopes on Android, no
    // client secret in the app) and Task.await() for coroutines
    implementation 'com.google.android.gms:play-services-auth:22.0.0'

    testImplementation 'junit:junit:4.13.2'
    // The real org.json for unit tests (Android's copy is only a stub there)
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}